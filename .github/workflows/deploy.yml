# GitHub Pages 部署（團隊共用手刻模式，源自 dreamer868 版；不用 withastro/action）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://www.ods.yao.care

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是必要的——sitemap 的 lastmod 取自各檔的 git commit 時間
      # （scripts/lib/lastmod.mjs）。預設的淺 checkout 只有一個 commit，
      # `git log -1 -- <檔>` 對絕大多數檔案會回空值，lastmod 會整批退回 build 時間，
      # 等於每次部署都宣稱「全站都改了」，Google 幾次之後就不信這個欄位。
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ⚠ 不要加 `with: version:`——package.json 已有 packageManager，action v6 會判定
      #   「Multiple versions of pnpm specified」直接 fail（2026-07-28 ttpa 首跑實測）。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      # build 內含 scripts/check-design.mjs 守門，設計違規會在這裡 fail
      - run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages CDN propagation
        run: sleep 15

      - name: Fetch sitemap and verify all URLs
        run: |
          echo "Fetching sitemap index..."
          SITEMAPS=$(curl -sf "$SITE_URL/sitemap-index.xml" \
            | grep -oP '(?<=<loc>)[^<]+')

          URLS=""
          for sm in $SITEMAPS; do
            echo "Fetching $sm ..."
            URLS="$URLS $(curl -sf "$sm" | grep -oP '(?<=<loc>)[^<]+')"
          done

          TOTAL=0
          FAILED=0
          FAIL_LIST=""

          for u in $URLS; do
            TOTAL=$((TOTAL + 1))
            CODE=$(curl -sf -o /dev/null -w '%{http_code}' "$u")
            if [ "$CODE" != "200" ]; then
              FAILED=$((FAILED + 1))
              FAIL_LIST="$FAIL_LIST\n  ✗ $CODE $u"
            fi
          done

          echo ""
          echo "===== Verification Result ====="
          echo "Total URLs: $TOTAL"
          echo "Failed: $FAILED"

          if [ "$FAILED" -gt 0 ]; then
            echo -e "\nFailed URLs:$FAIL_LIST"
            exit 1
          else
            echo "All URLs returned 200 ✓"
          fi

  # 上線後把 sitemap URL 送 IndexNow（Bing/Yandex/Seznam/Naver 即時收錄；Google 不吃 IndexNow）。
  # 金鑰非機密（本就公開託管於 /<key>.txt），直接寫在 env。任何失敗 exit 0，不擋部署。
  # ⚠ 若日後替本 workflow 加 `schedule:`（定時重建）觸發，這個 job 要加
  #   `if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'`，
  #   否則每次 cron 重建都會重送整份 sitemap（內容沒變也洗版）。見 evidencetoday 2026-07-20。
  indexnow:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Submit sitemap URLs to IndexNow
        env:
          INDEXNOW_KEY: 770ed0a7691038e945d0cb91b9410f4a
        # needs: verify 已確保 CDN propagate；此 sleep 是給「沒有 verify job 的複製情境」的防禦——
        # 首次部署若金鑰檔/新頁尚未 propagate，IndexNow 抓 keyLocation 會 403（見 crin 2026-07-20）。
        run: |
          sleep 20
          node scripts/indexnow-submit.mjs

  # 任一階段 fail → 發 Slack 要求修改；修正 push 後 workflow 自動重跑＝重審。
  # 需 repo secrets：SLACK_BOT_TOKEN、SLACK_CHANNEL_ID（缺則靜默略過）。
  notify-failure:
    needs: [build, deploy, verify]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL_ID" ]; then
            echo "Slack secrets not set; skip notify."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="🚨 ${{ github.repository }} 部署被守門擋下（commit ${GITHUB_SHA::7}）。請修正設計規範/建置錯誤後 push，workflow 會自動重審。詳情： $RUN_URL"
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            -d "$(jq -n --arg ch "$SLACK_CHANNEL_ID" --arg t "$TEXT" '{channel:$ch,text:$t}')"
